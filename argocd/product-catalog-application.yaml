apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-catalog
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Suguna1802/ultimate-devops-project-demo.git
    targetRevision: main
    path: kubernetes/productcatalog

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: false
      selfHeal: true