# CI pipeline for the Product Catalog microservice

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci.yaml"

  push:
    branches:
      - main
    paths:
      - "src/product-catalog/**"
      - ".github/workflows/ci.yaml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/product-catalog/go.sum

      - name: Download dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build application
        working-directory: src/product-catalog
        run: go build -o product-catalog-service .

      - name: Run unit tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    name: Code-quality check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/product-catalog/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: src/product-catalog

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs:
      - build
      - code-quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}

  update-kubernetes:
    name: Update Kubernetes image tag
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Update deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push manifest
        run: |
          git config user.email "Suguna1802@users.noreply.github.com"
          git config user.name "Suguna1802"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI] Update Product Catalog image tag"
          git push origin HEAD:main